<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages redirection script
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;
      window.location.replace(
        window.location.origin +
        path.substring(0, path.lastIndexOf('/') + 1) +
        'index.html' + (hash ? hash : '')
      );
    </script>
  </head>
  <body style="background-color: #050505; color: #fff; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to Ambigapathi V - Portfolio...</p>
  </body>
</html>
