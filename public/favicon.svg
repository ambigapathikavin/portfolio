<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="avGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#06b6d4" stroke-width="1.8" stroke-opacity="0.8"/>
  
  <!-- Subtle neural data node accent dots -->
  <circle cx="12" cy="12" r="1.5" fill="#06b6d4" opacity="0.6"/>
  <circle cx="52" cy="12" r="1.5" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="52" cy="52" r="1.5" fill="#06b6d4" opacity="0.6"/>
  <circle cx="12" cy="52" r="1.5" fill="#3b82f6" opacity="0.6"/>
  <path d="M12 12 L52 12 M52 12 L52 52" stroke="#06b6d4" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.25"/>

  <!-- Stylized AV Monogram -->
  <text 
    x="32" 
    y="41" 
    font-family="'JetBrains Mono', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
    font-size="27" 
    font-weight="900" 
    letter-spacing="-0.5" 
    fill="url(#avGrad)" 
    text-anchor="middle"
    filter="url(#glow)">
    AV
  </text>
  
  <!-- Tech data spark badge -->
  <circle cx="47" cy="19" r="2.5" fill="#22d3ee"/>
</svg>
