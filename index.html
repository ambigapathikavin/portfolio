    <!-- Critical Preload for LCP (Hero Portrait Image).
         imagesrcset/imagesizes make the preloaded candidate MATCH what the
         <picture> in AmbigapathiPortrait.tsx will actually request, so mobile
         stops downloading the 900w file it never uses. -->
    <link rel="preload" as="image" href="./portfolio.webp" type="image/webp"
          imagesrcset="./portfolio-450.webp 450w, ./portfolio.webp 900w"
          imagesizes="(max-width: 640px) 360px, 450px" fetchpriority="high" />

    <!-- Performance: DNS Prefetch & Preconnect for External Assets -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-Render-Blocking Asynchronous Font Loading.
         `crossorigin` is required on the preload, otherwise it is fetched
         twice (CORS and non-CORS) and the browser warns it was "not used". -->
    <link rel="preload" as="style" crossorigin
          href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
          media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" />
    </noscript>
  </head>
  <body class="dark bg-[#080c14] text-slate-100 font-sans antialiased selection:bg-cyan-500/30 selection:text-cyan-200 min-h-screen">
    <!-- ============================================================
         Blocking theme bootstrap (must run before first paint).
         index.css drives light mode off `body:not(.dark)`, so without
         this the body has no `dark` class for one frame and every dark
         visitor sees a white flash. Must stay the FIRST child of <body>.
         Keep the storage key in sync with src/context/ThemeContext.tsx.
         ============================================================ -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portfolio_theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                  ? 'light'
                  : 'dark');
          var dark = theme === 'dark';
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.classList.toggle('light', !dark);
          document.body.classList.toggle('dark', dark);
          document.body.classList.toggle('light', !dark);
        } catch (e) {
          /* storage blocked - keep the default dark classes from the markup */
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Cloudflare Web Analytics.
