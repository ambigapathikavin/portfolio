name: Deploy Portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Cancel superseded in-flight deploys for the same branch.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # bun.lock is the single source of truth. package-lock.json is gitignored
      # so local npm/pnpm installs can never drift from what CI deploys.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `build` runs tsc --noEmit before vite build, so a type error fails CI
      # instead of shipping to production.
      - name: Typecheck and build
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4